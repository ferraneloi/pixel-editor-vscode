<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">

<defs>
  <clipPath id="cc">
    <rect x="6" y="6" width="72" height="72" rx="8"/>
  </clipPath>
</defs>

<!-- Canvas bg -->
<rect x="6" y="6" width="72" height="72" rx="8" fill="#1a1a2e" stroke="#e94560" stroke-width="2.5"/>

<!-- Transparency checker corner -->
<rect x="6"  y="6"  width="9" height="9" fill="#2d2d2d" clip-path="url(#cc)"/>
<rect x="15" y="6"  width="9" height="9" fill="#1a1a1a" clip-path="url(#cc)"/>
<rect x="6"  y="15" width="9" height="9" fill="#1a1a1a" clip-path="url(#cc)"/>
<rect x="15" y="15" width="9" height="9" fill="#2d2d2d" clip-path="url(#cc)"/>

<!-- Pixel art — 8x8 grid at 9px each -->
<rect x="24" y="6"  width="9"  height="9" fill="#e94560"/>
<rect x="42" y="6"  width="9"  height="9" fill="#e94560"/>
<rect x="60" y="6"  width="9"  height="9" fill="#533483"/>
<rect x="15" y="15" width="9"  height="9" fill="#533483"/>
<rect x="24" y="15" width="18" height="9" fill="#e94560"/>
<rect x="51" y="15" width="9"  height="9" fill="#e94560"/>
<rect x="69" y="15" width="9"  height="9" fill="#7a4fa8"/>
<rect x="24" y="24" width="9"  height="9" fill="#7a4fa8"/>
<rect x="42" y="24" width="27" height="9" fill="#533483"/>
<rect x="15" y="33" width="27" height="9" fill="#533483"/>
<rect x="60" y="33" width="9"  height="9" fill="#e94560"/>
<rect x="33" y="42" width="9"  height="9" fill="#e94560"/>
<rect x="51" y="42" width="9"  height="9" fill="#7a4fa8"/>
<rect x="69" y="42" width="9"  height="9" fill="#533483"/>
<rect x="15" y="51" width="9"  height="9" fill="#7a4fa8"/>
<rect x="42" y="51" width="18" height="9" fill="#533483"/>
<rect x="69" y="51" width="9"  height="9" fill="#e94560"/>
<rect x="24" y="60" width="9"  height="9" fill="#533483"/>
<rect x="51" y="60" width="9"  height="9" fill="#e94560"/>
<rect x="60" y="60" width="9"  height="9" fill="#533483"/>
<rect x="33" y="69" width="18" height="9" fill="#7a4fa8"/>
<rect x="60" y="69" width="9"  height="9" fill="#e94560"/>

<!-- Grid lines -->
<line x1="6"  y1="15" x2="78" y2="15" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="6"  y1="24" x2="78" y2="24" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="6"  y1="33" x2="78" y2="33" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="6"  y1="42" x2="78" y2="42" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="6"  y1="51" x2="78" y2="51" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="6"  y1="60" x2="78" y2="60" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="6"  y1="69" x2="78" y2="69" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="15" y1="6"  x2="15" y2="78" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="24" y1="6"  x2="24" y2="78" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="33" y1="6"  x2="33" y2="78" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="42" y1="6"  x2="42" y2="78" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="51" y1="6"  x2="51" y2="78" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="60" y1="6"  x2="60" y2="78" stroke="#2a3a5c" stroke-width="0.6"/>
<line x1="69" y1="6"  x2="69" y2="78" stroke="#2a3a5c" stroke-width="0.6"/>

<!-- Active cursor pixel highlight -->
<rect x="51" y="42" width="9" height="9" fill="none" stroke="#ffffff" stroke-width="1.2"/>

<!-- Pencil overlapping canvas bottom-right -->
<g transform="translate(74,68) rotate(-40)">
  <rect x="-5.5" y="-44" width="11" height="10" rx="2.5" fill="#e94560"/>
  <rect x="-5.5" y="-35" width="11" height="5"  rx="1"   fill="#a02040"/>
  <rect x="-5.5" y="-30" width="11" height="36" rx="2"   fill="#f6c90e"/>
  <polygon points="0,9 -5.5,3 5.5,3"   fill="#e8d5a0"/>
  <polygon points="0,15 -2,7 2,7"     fill="#1a1a1a"/>
</g>

<!-- GIF animation film strip -->
<rect x="6" y="88" width="116" height="34" rx="5" fill="#0f3460" stroke="#533483" stroke-width="1.5"/>

<!-- Sprocket holes -->
<rect x="9"   y="91"  width="5" height="5" rx="1" fill="#1a1a2e"/>
<rect x="9"   y="113" width="5" height="5" rx="1" fill="#1a1a2e"/>
<rect x="114" y="91"  width="5" height="5" rx="1" fill="#1a1a2e"/>
<rect x="114" y="113" width="5" height="5" rx="1" fill="#1a1a2e"/>

<!-- Frame 1 active -->
<rect x="17" y="91" width="26" height="24" rx="3" fill="#1a1a2e" stroke="#e94560" stroke-width="1.5"/>
<rect x="20" y="94" width="6"  height="6"  fill="#e94560" opacity="0.9"/>
<rect x="28" y="94" width="6"  height="6"  fill="#533483"/>
<rect x="20" y="102" width="13" height="6" fill="#7a4fa8"/>
<rect x="34" y="102" width="6"  height="6"  fill="#e94560" opacity="0.8"/>
<rect x="20" y="106" width="6"  height="6"  fill="#533483"/>

<!-- Frame 2 -->
<rect x="47" y="91" width="26" height="24" rx="3" fill="#1a1a2e" stroke="#7a4fa8" stroke-width="1"/>
<rect x="50" y="94" width="6"  height="6"  fill="#533483"/>
<rect x="58" y="94" width="6"  height="6"  fill="#e94560" opacity="0.9"/>
<rect x="50" y="102" width="6"  height="6"  fill="#7a4fa8"/>
<rect x="58" y="102" width="13" height="6" fill="#533483"/>
<rect x="64" y="106" width="6"  height="6"  fill="#e94560" opacity="0.7"/>

<!-- Frame 3 -->
<rect x="77" y="91" width="26" height="24" rx="3" fill="#1a1a2e" stroke="#533483" stroke-width="1"/>
<rect x="80" y="94" width="13" height="6" fill="#e94560" opacity="0.8"/>
<rect x="80" y="102" width="6"  height="6"  fill="#533483"/>
<rect x="94" y="94"  width="6"  height="6"  fill="#7a4fa8"/>
<rect x="88" y="102" width="13" height="6" fill="#7a4fa8"/>

<!-- Loop animation arrow -->
<path d="M108 97 A8 8 0 1 1 100 107" fill="none" stroke="#4caf50" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="97,108 100,102 104,107" fill="#4caf50"/>

</svg>
