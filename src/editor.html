// ─────────────────────────────────────────────
// MULTI-FORMAT STATE
// ─────────────────────────────────────────────
let currentFormat = 'ico'; // 'ico'|'cur'|'gif'|'png'|'webp'
let animFrames = [];        // [{pixels, delay_ms}]  for animated formats
let currentAnimIdx = 0;
let playbackTimer = null;
let isPlaying = false;
let rawFileBytes = null;    // original file bytes for re-encode

const ANIMATED_FORMATS = ['gif', 'webp'];
const MULTI_FRAME_FORMATS = ['gif', 'webp'];

function detectFormat(fileName, bytes) {
  const ext = fileName.split('.').pop().toLowerCase();
  if (ext === 'cur') return 'cur';
  if (ext === 'gif') return 'gif';
  if (ext === 'webp') return 'webp';
  if (ext === 'png') return 'png';
  return 'ico';
}

function setFormat(fmt) {
  currentFormat = fmt;
  const badge = document.getElementById('format-badge');
  badge.textContent = fmt.toUpperCase();
  const colors = { ico:'#e94560', cur:'#f6c90e', gif:'#4caf50', png:'#00bcd4', webp:'#ff9800' };
  badge.style.color = colors[fmt] || '#e94560';

  const isAnim = ANIMATED_FORMATS.includes(fmt);
  const tl = document.getElementById('timeline-bar');
  if (isAnim) tl.classList.add('visible'); else tl.classList.remove('visible');

  const gifOpts = document.getElementById('gif-options-section');
  gifOpts.style.display = (fmt === 'gif') ? 'block' : 'none';

  const spriteRow = document.getElementById('sprite-grid-row');
  spriteRow.style.display = (fmt === 'png') ? 'flex' : 'none';

  // Size tabs label
  const sizesLabel = document.querySelector('#sizes-bar > span');
  if (sizesLabel) {
    if (isAnim) sizesLabel.textContent = 'SIZE:';
    else if (fmt === 'png') sizesLabel.textContent = 'SPRITE:';
    else sizesLabel.textContent = 'SIZES:';
  }
}

// ─────────────────────────────────────────────
// LOAD OVERRIDE — detect format and route
// ─────────────────────────────────────────────
// (The original message handler is replaced here with a unified one)
window.addEventListener('message', async e => {
  const msg = e.data;
  if (msg.type !== 'load') return;
  rawFileBytes = new Uint8Array(msg.data);
  const fmt = detectFormat(msg.fileName, rawFileBytes);
  setFormat(fmt);

  if (fmt === 'gif') {
    await loadGif(rawFileBytes, msg.fileName);
  } else if (fmt === 'webp') {
    await loadWebP(rawFileBytes, msg.fileName);
  } else if (fmt === 'png') {
    await loadPng(rawFileBytes, msg.fileName);
  } else {
    // ico / cur — use existing ICO parser
    document.getElementById('filename-display').textContent = msg.fileName;
    const buf = rawFileBytes.buffer.slice(rawFileBytes.byteOffset, rawFileBytes.byteOffset + rawFileBytes.byteLength);
    try {
      const parsed = parseIco(buf);
      frames = [];
      for (const f of parsed) {
        if (f.pngData) {
          const px = await pngToPixels(f.pngData, f.width, f.height);
          frames.push({ width: f.width, height: f.height, pixels: px });
        } else {
          frames.push({ width: f.width, height: f.height, pixels: f.pixels });
        }
      }
      if (frames.length === 0) frames.push(blankFrame(16, 16));
      currentFrameIdx = 0;
      buildSizeTabs();
      selectFrame(0);
      undoStack = []; redoStack = [];
    } catch(err) {
      frames = [blankFrame(16, 16)];
      currentFrameIdx = 0;
      buildSizeTabs();
      selectFrame(0);
    }
  }
});

// ─────────────────────────────────────────────
// GIF DECODER (pure JS, handles LZW)
// ─────────────────────────────────────────────
async function loadGif(bytes, fileName) {
  document.getElementById('filename-display').textContent = fileName;
  try {
    const decoded = decodeGIF(bytes);
    if (!decoded || decoded.frames.length === 0) throw new Error('Empty GIF');
    frames = [];
    animFrames = [];
    for (const f of decoded.frames) {
      const px = new Uint8ClampedArray(f.pixels.buffer
        ? f.pixels.buffer.slice(f.pixels.byteOffset, f.pixels.byteOffset + f.pixels.byteLength)
        : f.pixels);
      const frame = { width: decoded.width, height: decoded.height, pixels: px };
      frames.push(frame);
      animFrames.push({ pixels: px, delay_ms: Math.max(20, (f.delay || 10) * 10) });
    }
    currentFrameIdx = 0;
    currentAnimIdx = 0;
    buildSizeTabs();
    fitToView();
    renderAll();
    buildPreview();
    buildCheckerboard();
    buildTimeline();
    undoStack = []; redoStack = [];
    showToast(`GIF — ${decoded.frames.length} frames, ${decoded.width}×${decoded.height}`);
  } catch(err) {
    showToast('GIF parse error: ' + (err.message || err));
    frames = [blankFrame(64, 64)];
    animFrames = [{ pixels: frames[0].pixels, delay_ms: 100 }];
    currentFrameIdx = 0; currentAnimIdx = 0;
    buildSizeTabs(); fitToView(); renderAll(); buildTimeline();
  }
}

async function loadWebP(bytes, fileName) {
  document.getElementById('filename-display').textContent = fileName;
  const blob = new Blob([bytes], {type: 'image/webp'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  await new Promise(res => { img.onload = res; img.onerror = res; img.src = url; });
  URL.revokeObjectURL(url);
  const w = img.naturalWidth || 64, h = img.naturalHeight || 64;
  const tc = document.createElement('canvas'); tc.width = w; tc.height = h;
  tc.getContext('2d').drawImage(img, 0, 0);
  const px = new Uint8ClampedArray(tc.getContext('2d').getImageData(0, 0, w, h).data);
  frames = [{ width: w, height: h, pixels: px }];
  animFrames = [{ pixels: px, delay_ms: 100 }];
  currentFrameIdx = 0; currentAnimIdx = 0;
  buildSizeTabs(); fitToView(); renderAll(); buildPreview(); buildCheckerboard(); buildTimeline();
  showToast('WebP loaded');
}

async function loadPng(bytes, fileName) {
  document.getElementById('filename-display').textContent = fileName;
  const blob = new Blob([bytes], {type: 'image/png'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  await new Promise(res => { img.onload = res; img.onerror = res; img.src = url; });
  URL.revokeObjectURL(url);
  const w = img.naturalWidth || 32, h = img.naturalHeight || 32;
  const tc = document.createElement('canvas'); tc.width = w; tc.height = h;
  tc.getContext('2d').drawImage(img, 0, 0);
  const px = new Uint8ClampedArray(tc.getContext('2d').getImageData(0, 0, w, h).data);
  frames = [{ width: w, height: h, pixels: px }];
  animFrames = [];
  currentFrameIdx = 0;
  buildSizeTabs(); fitToView(); renderAll(); buildPreview(); buildCheckerboard();
  showToast(`PNG — ${w}×${h}`);
}

// ─────────────────────────────────────────────
// GIF DECODER
// ─────────────────────────────────────────────
function decodeGIF(bytes) {
  const data = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  let pos = 0;
  const r8 = () => data[pos++];
  const r16 = () => { const v = data[pos] | (data[pos+1]<<8); pos+=2; return v; };

  const sig = String.fromCharCode(data[0],data[1],data[2]);
  if (sig !== 'GIF') throw new Error('Not a GIF');
  pos = 6;
  const width = r16(), height = r16();
  const packed = r8();
  const bgIdx = r8(); r8(); // aspect
  const hasGCT = (packed >> 7) & 1;
  const gctSize = 1 << ((packed & 7) + 1);

  let globalPalette = null;
  if (hasGCT) {
    globalPalette = [];
    for (let i = 0; i < gctSize; i++) globalPalette.push([data[pos++],data[pos++],data[pos++]]);
  }

  const frames = [];
  let gcDelay = 0, gcTransIdx = -1, gcDisposal = 0;

  while (pos < data.length) {
    const block = r8();
    if (block === 0x3B) break; // trailer

    if (block === 0x21) { // extension
      const label = r8();
      if (label === 0xF9) { // graphic control
        r8(); // block size = 4
        const p = r8();
        gcDisposal = (p >> 3) & 7;
        const hasTransp = p & 1;
        gcDelay = r16();
        gcTransIdx = hasTransp ? r8() : -1;
        if (!hasTransp) r8();
        r8(); // block terminator
      } else {
        // skip
        while (true) { const sz = r8(); if (sz === 0) break; pos += sz; }
      }
    } else if (block === 0x2C) { // image descriptor
      const fx = r16(), fy = r16(), fw = r16(), fh = r16();
      const ip = r8();
      const hasLCT = (ip >> 7) & 1;
      const isInterlaced = (ip >> 6) & 1;
      const lctSize = 1 << ((ip & 7) + 1);
      let palette = globalPalette;
      if (hasLCT) {
        palette = [];
        for (let i = 0; i < lctSize; i++) palette.push([data[pos++],data[pos++],data[pos++]]);
      }
      const minCodeSize = r8();
      // Collect sub-blocks
      const compressed = [];
      while (true) { const sz = r8(); if (sz === 0) break; for (let i=0;i<sz;i++) compressed.push(data[pos++]); }
      const indices = lzwDecode(minCodeSize, compressed);

      // De-interlace if needed
      let orderedIndices = indices;
      if (isInterlaced) orderedIndices = deinterlace(indices, fw, fh);

      // Build RGBA
      const pixels = new Uint8ClampedArray(width * height * 4);
      for (let py = 0; py < fh; py++) {
        for (let px2 = 0; px2 < fw; px2++) {
          const idx = orderedIndices[py * fw + px2];
          const dx = fx + px2, dy = fy + py;
          if (dx >= width || dy >= height) continue;
          const di = (dy * width + dx) * 4;
          if (idx === gcTransIdx) {
            pixels[di+3] = 0;
          } else {
            const c = palette[idx] || [0,0,0];
            pixels[di]=c[0]; pixels[di+1]=c[1]; pixels[di+2]=c[2]; pixels[di+3]=255;
          }
        }
      }
      frames.push({ pixels, delay: gcDelay, disposal: gcDisposal });
      gcDelay = 0; gcTransIdx = -1;
    }
  }
  return { width, height, frames };
}

function lzwDecode(minCodeSize, data) {
  const clearCode = 1 << minCodeSize;
  const eofCode = clearCode + 1;
  let codeSize = minCodeSize + 1;
  let table = [];
  const initTable = () => {
    table = [];
    for (let i = 0; i < clearCode; i++) table.push([i]);
    table.push([]); table.push([]); // clear, eof
  };
  initTable();

  const output = [];
  let bitPos = 0;
  const readCode = () => {
    let code = 0;
    for (let i = 0; i < codeSize; i++) {
      const byteIdx = Math.floor(bitPos / 8);
      const bitIdx = bitPos % 8;
      if (byteIdx < data.length) code |= ((data[byteIdx] >> bitIdx) & 1) << i;
      bitPos++;
    }
    return code;
  };

  let prev = null;
  while (true) {
    const code = readCode();
    if (code === eofCode) break;
    if (code === clearCode) { initTable(); codeSize = minCodeSize + 1; prev = null; continue; }

    let entry;
    if (code < table.length) entry = table[code];
    else if (code === table.length && prev) entry = [...prev, prev[0]];
    else break;

    for (const v of entry) output.push(v);
    if (prev) {
      table.push([...prev, entry[0]]);
      if (table.length === (1 << codeSize) && codeSize < 12) codeSize++;
    }
    prev = entry;
  }
  return output;
}

function deinterlace(indices, w, h) {
  const out = new Array(w * h);
  const passes = [
    { start: 0, step: 8 },
    { start: 4, step: 8 },
    { start: 2, step: 4 },
    { start: 1, step: 2 },
  ];
  let src = 0;
  for (const pass of passes) {
    for (let y = pass.start; y < h; y += pass.step) {
      for (let x = 0; x < w; x++) out[y * w + x] = indices[src++];
    }
  }
  return out;
}

// ─────────────────────────────────────────────
// GIF ENCODER (LZW + full GIF89a)
// ─────────────────────────────────────────────
function encodeGIF(frames, loopCount = 0) {
  const w = frames[0].width, h = frames[0].height;
  const nColors = parseInt(document.getElementById('gif-colors-select')?.value || '256');
  const colorBits = Math.ceil(Math.log2(nColors));
  const paletteSize = 1 << colorBits;

  // Build global palette by median-cut of all frames combined
  const allPixels = [];
  for (const f of frames) {
    for (let i = 0; i < f.pixels.length; i += 4) {
      if (f.pixels[i+3] > 0) allPixels.push([f.pixels[i], f.pixels[i+1], f.pixels[i+2]]);
    }
  }
  const palette = medianCut(allPixels, paletteSize - 1); // reserve last for transparent
  const transpIdx = palette.length;
  while (palette.length < paletteSize) palette.push([0,0,0]);

  const out = [];
  // Header
  for (const c of 'GIF89a') out.push(c.charCodeAt(0));
  // Logical screen descriptor
  out.push(w & 0xFF, w >> 8, h & 0xFF, h >> 8);
  out.push(0x80 | (colorBits - 1)); // global CT flag + color res + size
  out.push(0); // bg color index
  out.push(0); // pixel aspect ratio
  // Global color table
  for (const [r,g,b] of palette) { out.push(r,g,b); }

  // Netscape loop extension
  out.push(0x21, 0xFF, 0x0B);
  for (const c of 'NETSCAPE2.0') out.push(c.charCodeAt(0));
  out.push(3, 1, loopCount & 0xFF, (loopCount >> 8) & 0xFF, 0);

  for (const f of frames) {
    const delay = Math.round((f.delay_ms || 100) / 10);
    // Graphic control extension
    out.push(0x21, 0xF9, 0x04);
    out.push(0x05); // disposal=1 + transparent
    out.push(delay & 0xFF, delay >> 8);
    out.push(transpIdx); // transparent color index
    out.push(0x00);

    // Image descriptor
    out.push(0x2C);
    out.push(0,0, 0,0); // left, top
    out.push(w & 0xFF, w >> 8, h & 0xFF, h >> 8);
    out.push(0x00); // no local CT, not interlaced

    // Build index stream
    const indices = [];
    for (let py = 0; py < h; py++) {
      for (let px2 = 0; px2 < w; px2++) {
        const si = (py * w + px2) * 4;
        const a = f.pixels[si+3];
        if (a < 128) { indices.push(transpIdx); continue; }
        indices.push(nearestColor(palette, f.pixels[si], f.pixels[si+1], f.pixels[si+2]));
      }
    }

    // LZW encode
    const minCodeSize = Math.max(2, colorBits);
    const compressed = lzwEncode(indices, minCodeSize);
    out.push(minCodeSize);
    // Write in sub-blocks of 255
    for (let i = 0; i < compressed.length; i += 255) {
      const chunk = compressed.slice(i, i + 255);
      out.push(chunk.length, ...chunk);
    }
    out.push(0); // block terminator
  }
  out.push(0x3B); // GIF trailer
  return new Uint8Array(out);
}

function lzwEncode(indices, minCodeSize) {
  const clearCode = 1 << minCodeSize;
  const eofCode = clearCode + 1;
  let codeSize = minCodeSize + 1;
  let table = new Map();
  const initTable = () => {
    table = new Map();
    for (let i = 0; i <= eofCode; i++) table.set(String(i), i);
  };
  initTable();

  const bits = [];
  const writeBits = (code) => {
    for (let i = 0; i < codeSize; i++) bits.push((code >> i) & 1);
  };

  writeBits(clearCode);
  let buf = '';
  let nextCode = eofCode + 1;

  for (let i = 0; i < indices.length; i++) {
    const c = String(indices[i]);
    const combined = buf + ',' + c;
    if (table.has(combined)) {
      buf = combined;
    } else {
      writeBits(table.get(buf));
      if (nextCode < 4096) {
        table.set(combined, nextCode++);
        if (nextCode > (1 << codeSize) && codeSize < 12) codeSize++;
      } else {
        writeBits(clearCode);
        initTable(); codeSize = minCodeSize + 1; nextCode = eofCode + 1;
      }
      buf = c;
    }
  }
  writeBits(table.get(buf));
  writeBits(eofCode);

  // Pack bits to bytes
  const bytes = [];
  for (let i = 0; i < bits.length; i += 8) {
    let b = 0;
    for (let j = 0; j < 8; j++) b |= ((bits[i+j] || 0) << j);
    bytes.push(b);
  }
  return bytes;
}

// ─────────────────────────────────────────────
// MEDIAN CUT COLOR QUANTIZATION
// ─────────────────────────────────────────────
function medianCut(pixels, maxColors) {
  if (pixels.length === 0) return [[0,0,0]];
  const buckets = [pixels];
  while (buckets.length < maxColors && buckets.some(b => b.length > 1)) {
    // Find largest bucket
    let largest = 0;
    for (let i = 1; i < buckets.length; i++) if (buckets[i].length > buckets[largest].length) largest = i;
    const bucket = buckets.splice(largest, 1)[0];
    if (bucket.length <= 1) { buckets.push(bucket); break; }
    // Find widest channel
    let minR=255,maxR=0,minG=255,maxG=0,minB=255,maxB=0;
    for (const [r,g,b] of bucket) {
      minR=Math.min(minR,r);maxR=Math.max(maxR,r);
      minG=Math.min(minG,g);maxG=Math.max(maxG,g);
      minB=Math.min(minB,b);maxB=Math.max(maxB,b);
    }
    const rng = [maxR-minR, maxG-minG, maxB-minB];
    const ch = rng.indexOf(Math.max(...rng));
    bucket.sort((a,b2) => a[ch]-b2[ch]);
    const mid = Math.floor(bucket.length / 2);
    buckets.push(bucket.slice(0, mid), bucket.slice(mid));
  }
  return buckets.map(b => {
    const n = b.length;
    return [
      Math.round(b.reduce((s,c)=>s+c[0],0)/n),
      Math.round(b.reduce((s,c)=>s+c[1],0)/n),
      Math.round(b.reduce((s,c)=>s+c[2],0)/n),
    ];
  });
}

function nearestColor(palette, r, g, b) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < palette.length; i++) {
    const [pr,pg,pb] = palette[i];
    const d = (r-pr)**2 + (g-pg)**2 + (b-pb)**2;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// ─────────────────────────────────────────────
// TIMELINE UI
// ─────────────────────────────────────────────
function buildTimeline() {
  const scroll = document.getElementById('timeline-scroll');
  if (!scroll) return;
  scroll.innerHTML = '';
  if (!animFrames.length) return;

  const f0 = frames[0] || { width: 32, height: 32 };
  const thumbSize = Math.min(48, Math.max(f0.width, f0.height));
  const scaleW = thumbSize / f0.width;
  const scaleH = thumbSize / f0.height;
  const thumbW = Math.round(f0.width  * Math.min(scaleW, scaleH));
  const thumbH = Math.round(f0.height * Math.min(scaleW, scaleH));

  animFrames.forEach((af, i) => {
    const div = document.createElement('div');
    div.className = 'tl-frame' + (i === currentAnimIdx ? ' active' : '');

    // Thumbnail canvas
    const tc = document.createElement('canvas');
    tc.width  = f0.width;
    tc.height = f0.height;
    tc.style.width  = thumbW + 'px';
    tc.style.height = thumbH + 'px';
    tc.style.imageRendering = 'pixelated';
    tc.style.display = 'block';
    try {
      const px = af.pixels instanceof Uint8ClampedArray
        ? af.pixels
        : new Uint8ClampedArray(af.pixels);
      if (px.length === f0.width * f0.height * 4) {
        tc.getContext('2d').putImageData(new ImageData(px, f0.width, f0.height), 0, 0);
      }
    } catch(e) { /* leave blank on error */ }

    const lbl = document.createElement('div');
    lbl.className = 'tl-label';
    lbl.textContent = '#' + (i + 1);

    const dur = document.createElement('div');
    dur.className = 'tl-dur';
    dur.title = 'Click to edit duration';
    dur.textContent = (af.delay_ms || 100) + 'ms';
    dur.onclick = (e) => { e.stopPropagation(); editFrameDuration(i, dur); };

    const del = document.createElement('span');
    del.className = 'tl-del';
    del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); deleteAnimFrameAt(i); };

    div.appendChild(del);
    div.appendChild(tc);
    div.appendChild(lbl);
    div.appendChild(dur);
    div.onclick = () => selectAnimFrame(i);
    div.draggable = true;
    div.addEventListener('dragstart', ev => ev.dataTransfer.setData('text/plain', String(i)));
    div.addEventListener('dragover',  ev => ev.preventDefault());
    div.addEventListener('drop', ev => {
      ev.preventDefault();
      reorderFrame(parseInt(ev.dataTransfer.getData('text/plain')), i);
    });
    scroll.appendChild(div);
  });

  // Scroll active frame into view
  const active = scroll.querySelector('.tl-frame.active');
  if (active) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}

// (selectAnimFrame defined above with selectFrame)

function editFrameDuration(i, el) {
  const val = prompt('Frame duration (ms):', animFrames[i].delay_ms || 100);
  if (val !== null) {
    animFrames[i].delay_ms = Math.max(20, parseInt(val) || 100);
    el.textContent = animFrames[i].delay_ms + 'ms';
  }
}

function addAnimFrame() {
  const f = frames[currentAnimIdx] || frames[0];
  const newPx = new Uint8ClampedArray(f.pixels);
  frames.push({ width: f.width, height: f.height, pixels: newPx });
  animFrames.push({ pixels: newPx, delay_ms: 100 });
  buildSizeTabs();
  selectAnimFrame(animFrames.length - 1);
}

function duplicateAnimFrame() {
  const f = frames[currentAnimIdx];
  if (!f) return;
  const newPx = new Uint8ClampedArray(f.pixels);
  const i = currentAnimIdx + 1;
  frames.splice(i, 0, { width: f.width, height: f.height, pixels: newPx });
  animFrames.splice(i, 0, { pixels: newPx, delay_ms: animFrames[currentAnimIdx].delay_ms });
  buildSizeTabs();
  selectAnimFrame(i);
}

function deleteAnimFrame() { deleteAnimFrameAt(currentAnimIdx); }
function deleteAnimFrameAt(i) {
  if (animFrames.length <= 1) { showToast('Cannot delete the last frame'); return; }
  frames.splice(i, 1);
  animFrames.splice(i, 1);
  const ni = Math.min(i, animFrames.length - 1);
  buildSizeTabs();
  selectAnimFrame(ni);
}

function reorderFrame(from, to) {
  if (from === to) return;
  const [af] = animFrames.splice(from, 1);
  animFrames.splice(to, 0, af);
  const [fr] = frames.splice(from, 1);
  frames.splice(to, 0, fr);
  buildSizeTabs();
  selectAnimFrame(to);
}

function onFpsChange() {
  const fps = parseInt(document.getElementById('fps-input').value) || 10;
  const delay = Math.round(1000 / fps);
  animFrames.forEach(af => af.delay_ms = delay);
  buildTimeline();
}

// ─────────────────────────────────────────────
// PLAYBACK
// ─────────────────────────────────────────────
function togglePlayback() {
  if (isPlaying) stopPlayback(); else startPlayback();
}

function startPlayback() {
  if (!animFrames.length) return;
  isPlaying = true;
  const btn = document.getElementById('play-btn');
  btn.textContent = '⏹ Stop'; btn.classList.add('playing');
  let idx = currentAnimIdx;

  function step() {
    if (!isPlaying) return;
    // Sync the canvas to this frame
    const f = frames[idx];
    const af = animFrames[idx];
    if (f && af) {
      f.pixels = af.pixels instanceof Uint8ClampedArray ? af.pixels : new Uint8ClampedArray(af.pixels);
      currentFrameIdx = idx;
      currentAnimIdx = idx;
      renderPixels();
      // Highlight active frame in timeline without full rebuild
      document.querySelectorAll('.tl-frame').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
    }
    idx = (idx + 1) % animFrames.length;
    const delay = animFrames[(idx === 0 ? animFrames.length - 1 : idx - 1)]?.delay_ms || 100;
    playbackTimer = setTimeout(step, delay);
  }
  step();
}

function stopPlayback() {
  isPlaying = false;
  clearTimeout(playbackTimer);
  const btn = document.getElementById('play-btn');
  btn.textContent = '▶ Play'; btn.classList.remove('playing');
}

// ─────────────────────────────────────────────
// ANIMATED PREVIEW MODAL
// ─────────────────────────────────────────────
let previewTimer = null;
function openAnimPreview() {
  clearTimeout(previewTimer);
  const modal = document.getElementById('anim-preview-modal');
  const ac = document.getElementById('anim-canvas');
  const actx = ac.getContext('2d');
  actx.imageSmoothingEnabled = false;

  const framesArr = animFrames.length ? animFrames : frames.map(f => ({ pixels: f.pixels, delay_ms: 100 }));
  if (!framesArr.length) return;

  const f0 = frames[0] || { width: 32, height: 32 };
  const maxDim = 240;
  const scale = Math.max(1, Math.min(Math.floor(maxDim / f0.width), Math.floor(maxDim / f0.height)));
  ac.width  = f0.width  * scale;
  ac.height = f0.height * scale;

  document.getElementById('anim-preview-info').textContent =
    `${f0.width}×${f0.height}  ·  ${framesArr.length} frame${framesArr.length !== 1 ? 's' : ''}`;

  modal.classList.add('open');

  let pi = 0;
  function step() {
    const af = framesArr[pi];
    const px = af.pixels instanceof Uint8ClampedArray ? af.pixels : new Uint8ClampedArray(af.pixels);
    if (px.length === f0.width * f0.height * 4) {
      const tmp = document.createElement('canvas');
      tmp.width = f0.width; tmp.height = f0.height;
      tmp.getContext('2d').putImageData(new ImageData(px, f0.width, f0.height), 0, 0);
      actx.clearRect(0, 0, ac.width, ac.height);
      actx.drawImage(tmp, 0, 0, f0.width * scale, f0.height * scale);
    }
    pi = (pi + 1) % framesArr.length;
    previewTimer = setTimeout(step, af.delay_ms || 100);
  }
  step();
}

function closeAnimPreview() {
  clearTimeout(previewTimer);
  document.getElementById('anim-preview-modal').classList.remove('open');
}

// ─────────────────────────────────────────────
// EXPORT / SAVE (multi-format)
// ─────────────────────────────────────────────
function exportCurrentFormat() {
  closeAnimPreview();
  saveFileMulti();
}

function saveFileMulti() {
  if (currentFormat === 'gif') {
    if (animFrames.length === 0) {
      animFrames = frames.map(f => ({ pixels: f.pixels, delay_ms: 100 }));
    }
    const loopCount = parseInt(document.getElementById('loop-count').value) || 0;
    const gifFrames = frames.map((f, i) => ({ ...f, delay_ms: animFrames[i]?.delay_ms || 100 }));
    const output = encodeGIF(gifFrames, loopCount);
    vscode.postMessage({ type: 'save', data: Array.from(output) });
    showToast('GIF saved ✓');
  } else if (currentFormat === 'png') {
    const f = frames[currentFrameIdx];
    const tc = document.createElement('canvas'); tc.width = f.width; tc.height = f.height;
    tc.getContext('2d').putImageData(new ImageData(f.pixels, f.width, f.height), 0, 0);
    tc.toBlob(blob => {
      blob.arrayBuffer().then(buf => {
        vscode.postMessage({ type: 'save', data: Array.from(new Uint8Array(buf)) });
        showToast('PNG saved ✓');
      });
    }, 'image/png');
  } else if (currentFormat === 'webp') {
    const f = frames[currentFrameIdx];
    const tc = document.createElement('canvas'); tc.width = f.width; tc.height = f.height;
    tc.getContext('2d').putImageData(new ImageData(f.pixels, f.width, f.height), 0, 0);
    tc.toBlob(blob => {
      blob.arrayBuffer().then(buf => {
        vscode.postMessage({ type: 'save', data: Array.from(new Uint8Array(buf)) });
        showToast('WebP saved ✓');
      });
    }, 'image/webp', 0.92);
  } else {
    // ico / cur
    const output = writeIco(frames);
    vscode.postMessage({ type: 'save', data: Array.from(output) });
    showToast(`${currentFormat.toUpperCase()} saved ✓`);
  }
}

// ─────────────────────────────────────────────
// PNG SPRITESHEET SPLITTER
// ─────────────────────────────────────────────
function splitSpritesheet() {
  const cols = parseInt(document.getElementById('sprite-cols').value) || 4;
  const rows = parseInt(document.getElementById('sprite-rows').value) || 4;
  const f = frames[0];
  const cw = Math.floor(f.width / cols), ch = Math.floor(f.height / rows);
  if (cw < 1 || ch < 1) { showToast('Cells too small'); return; }
  frames = [];
  for (let ry = 0; ry < rows; ry++) {
    for (let cx = 0; cx < cols; cx++) {
      const px = new Uint8ClampedArray(cw * ch * 4);
      for (let py = 0; py < ch; py++) {
        for (let px2 = 0; px2 < cw; px2++) {
          const si = ((ry*ch+py)*f.width + cx*cw+px2)*4;
          const di = (py*cw+px2)*4;
          px[di]=f.pixels[si]; px[di+1]=f.pixels[si+1];
          px[di+2]=f.pixels[si+2]; px[di+3]=f.pixels[si+3];
        }
      }
      frames.push({ width: cw, height: ch, pixels: px });
    }
  }
  buildSizeTabs(); selectFrame(0);
  showToast(`Split into ${frames.length} sprites (${cw}×${ch})`);
}

// Patch pushUndo to also sync animFrames pixels
const _basePushUndo = pushUndo;
pushUndo = function() {
  _basePushUndo();
  if (ANIMATED_FORMATS.includes(currentFormat) && animFrames[currentFrameIdx]) {
    animFrames[currentFrameIdx].pixels = frames[currentFrameIdx]?.pixels;
  }
};

buildPalette();
updateColorUI();
// Init with blank 16x16 until file loads
frames = [blankFrame(16, 16)];
buildSizeTabs();
selectFrame(0);
vscode.postMessage({ type: 'ready' });
</script>
